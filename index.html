<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<title>A hug for Phoebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* pastel background stops */
    --bg-pink:#ffe3ee; --bg-lav:#ebe2ff; --bg-mint:#dff6ec; --bg-peach:#ffe7d6;
    /* pastel accents */
    --p-pink:#ffc4da; --p-lav:#d9caff; --p-mint:#bdeedb; --p-peach:#ffd3b8; --p-rose:#f9bcd3;
    /* soft mauve text (contrast-checked) */
    --text:#74586f;      /* body text, >=5.0:1 on every bg stop */
    --head:#7a5c78;      /* headline, >=4.6:1 */
    --rose:#b0688a;      /* "Phoebe" accent, large text, >=3.25:1 */
    --feature:#7a5c78;   /* blob eyes + mouth */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Quicksand",ui-rounded,"SF Pro Rounded","Segoe UI","Nunito",system-ui,-apple-system,sans-serif;
    color:var(--text);
    min-height:100vh;min-height:100dvh;
    overflow-x:hidden;
    background-color:var(--bg-lav);
    background-image:linear-gradient(160deg,var(--bg-pink) 0%,var(--bg-lav) 38%,var(--bg-mint) 70%,var(--bg-peach) 100%);
    background-size:200% 200%;
    animation:bgShift 18s ease-in-out infinite alternate;
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes bgShift{from{background-position:0% 0%}to{background-position:100% 100%}}

  .heart{display:block;width:100%;height:100%}
  .heart path{stroke:rgba(255,255,255,.7);stroke-width:1.2}

  #sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .float-heart{
    position:absolute;bottom:-40px;
    width:var(--s,18px);height:var(--s,18px);opacity:0;
    animation:rise var(--d,12s) linear forwards;
  }
  @keyframes rise{
    0%{transform:translate(0,0) rotate(0);opacity:0}
    10%{opacity:var(--o,.8)}
    50%{transform:translate(var(--sway,20px),-55vh) rotate(10deg)}
    90%{opacity:var(--o,.8)}
    100%{transform:translate(0,-112vh) rotate(-8deg);opacity:0}
  }

  main{
    position:relative;z-index:1;
    max-width:460px;margin:0 auto;
    min-height:100vh;min-height:100dvh;
    padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:14px;
  }
  .eyebrow{
    font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--text);background:rgba(255,255,255,.55);
    padding:6px 14px;border-radius:999px;
  }
  h1{
    font-size:clamp(1.8rem,8vw,2.5rem);line-height:1.15;font-weight:700;
    color:var(--head);
    text-shadow:0 2px 0 rgba(255,255,255,.6);
  }
  h1 .name{color:var(--rose);white-space:nowrap}
  .inline-heart{display:inline-block;width:.8em;height:.8em;vertical-align:-.05em;margin-left:.15em}
  .sub{font-size:1.02rem;line-height:1.5;color:var(--text);max-width:30ch}

  .stage{position:relative;width:200px;height:190px;margin:4px 0 0}
  .buddy{width:100%;height:100%;transform-origin:50% 100%;animation:bounce 2.4s ease-in-out infinite}
  @keyframes bounce{
    0%,100%{transform:translateY(0) rotate(-3deg) scale(1,1)}
    25%{transform:translateY(-12px) rotate(0deg) scale(.98,1.03)}
    50%{transform:translateY(0) rotate(3deg) scale(1.03,.97)}
    75%{transform:translateY(-8px) rotate(0deg) scale(.99,1.02)}
  }
  .arm{transform-box:fill-box;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  .arm.left{transform-origin:100% 30%;animation:waveL 2.4s ease-in-out infinite}
  .arm.right{transform-origin:0% 30%;animation:waveR 2.4s ease-in-out infinite}
  @keyframes waveL{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-14deg)}}
  @keyframes waveR{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
  .shadow{position:absolute;left:50%;bottom:-6px;width:110px;height:14px;margin-left:-55px;
    background:rgba(201,180,220,.35);border-radius:50%;animation:shadow 2.4s ease-in-out infinite}
  @keyframes shadow{0%,50%,100%{transform:scale(1)}25%,75%{transform:scale(.85)}}

  .hugging .buddy{animation:squeeze .9s cubic-bezier(.3,1.4,.5,1)}
  .hugging .arm.left{animation:none;transform:translate(36px,10px) rotate(-28deg)}
  .hugging .arm.right{animation:none;transform:translate(-36px,10px) rotate(28deg)}
  .hugging .eye{transform:scaleY(.15)}
  .hugging .blush{opacity:1}
  .eye{transform-box:fill-box;transform-origin:center;transition:transform .2s}
  .blush{opacity:.75;transition:opacity .3s}
  @keyframes squeeze{
    0%{transform:scale(1,1)}25%{transform:scale(1.14,.86)}50%{transform:scale(.92,1.08)}
    75%{transform:scale(1.04,.97)}100%{transform:scale(1,1)}
  }

  .hug-btn{
    position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;
    font:inherit;font-weight:700;font-size:1.25rem;letter-spacing:.01em;
    color:#6e5470;
    min-height:64px;min-width:240px;padding:16px 34px;
    border:2px solid rgba(255,255,255,.75);border-radius:999px;cursor:pointer;
    background:linear-gradient(135deg,#ffd3e3,#e4d8ff);
    box-shadow:0 10px 22px -10px rgba(190,160,210,.55),inset 0 -3px 0 rgba(201,180,220,.25),inset 0 2px 0 rgba(255,255,255,.6);
    transition:transform .15s ease,box-shadow .15s ease,background .2s ease;
    touch-action:manipulation;
    animation:pulse 2.8s ease-in-out infinite;
    margin-top:6px;
  }
  .hug-btn .inline-heart{width:1.1em;height:1.1em;margin:0}
  .hug-btn:hover{transform:translateY(-2px);background:linear-gradient(135deg,#ffdbe8,#ebe1ff)}
  .hug-btn:active{transform:scale(.95);background:linear-gradient(135deg,#ffcadd,#ddd0ff);box-shadow:0 5px 12px -8px rgba(190,160,210,.55)}
  .hug-btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
  @keyframes pulse{0%,100%{box-shadow:0 10px 22px -10px rgba(190,160,210,.55),0 0 0 0 rgba(255,196,218,.55)}
    50%{box-shadow:0 10px 22px -10px rgba(190,160,210,.55),0 0 0 14px rgba(255,196,218,0)}}

  .message{
    min-height:3.4em;display:flex;align-items:center;justify-content:center;
    font-size:1.12rem;font-weight:700;color:var(--text);max-width:28ch;line-height:1.4;
  }
  .message span.bubble{
    display:inline-block;background:rgba(255,255,255,.7);
    padding:10px 18px;border-radius:18px;border:1.5px solid rgba(249,188,211,.6);
    box-shadow:0 6px 18px -10px rgba(190,160,210,.5);
    animation:pop .5s cubic-bezier(.3,1.6,.5,1);
  }
  .message:empty{visibility:hidden}
  @keyframes pop{from{transform:scale(.6) translateY(8px);opacity:0}to{transform:scale(1);opacity:1}}
  .count{font-size:.85rem;color:var(--text);min-height:1.2em}
  footer{font-size:.85rem;color:var(--text);margin-top:6px}

  #burst{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .particle{
    position:absolute;left:0;top:0;width:var(--s,20px);height:var(--s,20px);
    will-change:transform,opacity;
    animation:fly var(--d,1100ms) cubic-bezier(.15,.7,.35,1) forwards;
  }
  @keyframes fly{
    0%{transform:translate(var(--x0),var(--y0)) scale(.3) rotate(0);opacity:1}
    70%{opacity:1}
    100%{transform:translate(var(--x1),var(--y1)) scale(1) rotate(var(--r,20deg));opacity:0}
  }

  @media (prefers-reduced-motion: reduce){
    body,.buddy,.arm.left,.arm.right,.shadow,.hug-btn{animation:none !important}
    .hugging .buddy{animation:none}
    .float-heart{display:none}
    .message span.bubble{animation:none}
  }
  @media (max-height:640px){ .stage{width:160px;height:150px} main{gap:10px} }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="burst" aria-hidden="true"></div>

<main>
  <div class="eyebrow">a little something from Frank</div>
  <h1>Sending you the biggest hug, <span class="name">Phoebe<svg class="inline-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#f7b3cc" stroke="#fff" stroke-width="1"/></svg></span></h1>
  <p class="sub">Wherever you are right now, I hope this wraps around you like a warm blanket. Love, Frank.</p>

  <div class="stage" id="stage" aria-hidden="true">
    <svg class="buddy" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyG" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#fff0f5"/>
          <stop offset="60%" stop-color="#ffd3e2"/>
          <stop offset="100%" stop-color="#f9c3d6"/>
        </radialGradient>
      </defs>
      <path d="M100 22 C150 22 172 70 170 115 C168 160 140 182 100 182 C60 182 32 160 30 115 C28 70 50 22 100 22Z" fill="url(#bodyG)" stroke="#f6c0d4" stroke-width="1.5"/>
      <ellipse class="arm left" stroke="#f3bbd0" stroke-width="1.5" cx="38" cy="128" rx="24" ry="13" fill="#ffd0e0"/>
      <ellipse class="arm right" stroke="#f3bbd0" stroke-width="1.5" cx="162" cy="128" rx="24" ry="13" fill="#ffd0e0"/>
      <path d="M100 160 l-11 -11 a7 7 0 0 1 11 -9 a7 7 0 0 1 11 9z" fill="#d9caff"/>
      <path d="M100 24 C98 12 92 8 86 8 C88 16 94 22 100 24Z" fill="#b5e8d3"/>
      <path d="M100 24 C102 12 110 6 118 8 C114 18 106 22 100 24Z" fill="#c9f0df"/>
      <ellipse class="eye" cx="78" cy="96" rx="7" ry="9" fill="#7a5c78"/>
      <ellipse class="eye" cx="122" cy="96" rx="7" ry="9" fill="#7a5c78"/>
      <circle cx="80" cy="93" r="2.4" fill="#fff"/>
      <circle cx="124" cy="93" r="2.4" fill="#fff"/>
      <ellipse class="blush" cx="64" cy="114" rx="11" ry="6" fill="#ffb9cf"/>
      <ellipse class="blush" cx="136" cy="114" rx="11" ry="6" fill="#ffb9cf"/>
      <path d="M90 113 Q100 124 110 113" stroke="#7a5c78" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="shadow"></div>
  </div>

  <button class="hug-btn" id="hugBtn" type="button">Tap for a hug <svg class="inline-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#fff4f8" stroke="#f3b6cc" stroke-width="1.5"/></svg></button>
  <p class="message" id="message" role="status" aria-live="polite"></p>
  <p class="count" id="count"></p>
  <footer>made with love (and a little code) by Frank</footer>
</main>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sky = document.getElementById('sky');
  var burst = document.getElementById('burst');
  var btn = document.getElementById('hugBtn');
  var stage = document.getElementById('stage');
  var msgEl = document.getElementById('message');
  var countEl = document.getElementById('count');
  var NS = 'http://www.w3.org/2000/svg';
  var HEART = 'M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z';
  // pastel heart colours: pink, lavender, mint, peach, rose, sky
  var colours = ['#ffc4da','#d9caff','#bdeedb','#ffd3b8','#f9bcd3','#c8e4ff'];
  var messages = [
    "Squeeeeze! That one's from Frank",
    "Hug delivered. Refills are unlimited",
    "Frank says: you're his favourite person",
    "This hug comes with extra cuddles",
    "Holding on a little longer\u2026",
    "Warm hug, soft heart, all for you",
    "Wherever you are, Frank's arms reach you",
    "One more? Always one more"
  ];
  var idx = -1, hugs = 0, hugTimer;

  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function heartSvg(fill, cls){
    var s = document.createElementNS(NS,'svg');
    s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class', cls || 'heart');
    var p = document.createElementNS(NS,'path');
    p.setAttribute('d', HEART); p.setAttribute('fill', fill);
    s.appendChild(p); return s;
  }

  function spawnFloat(){
    if (document.hidden) return;
    var h = document.createElement('span');
    h.className = 'float-heart';
    h.appendChild(heartSvg(pick(colours)));
    h.style.left = (Math.random()*96) + 'vw';
    h.style.setProperty('--s', (14 + Math.random()*16) + 'px');
    h.style.setProperty('--d', (10 + Math.random()*8) + 's');
    h.style.setProperty('--o', (.6 + Math.random()*.35).toFixed(2));
    h.style.setProperty('--sway', ((Math.random()*60) - 30) + 'px');
    sky.appendChild(h);
    h.addEventListener('animationend', function(){ h.remove(); });
  }
  if (!reduce){
    for (var i=0;i<6;i++) setTimeout(spawnFloat, i*700);
    setInterval(spawnFloat, 1300);
  }

  function burstHearts(){
    if (reduce) return;
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    for (var i=0;i<22;i++){
      var p = document.createElement('span');
      p.className = 'particle';
      p.appendChild(heartSvg(pick(colours)));
      var ang = Math.random()*Math.PI*2;
      var dist = 90 + Math.random()*120;
      var x1 = cx + Math.cos(ang)*dist, y1 = cy + Math.sin(ang)*dist - 60;
      p.style.setProperty('--x0', (cx-10) + 'px');
      p.style.setProperty('--y0', (cy-10) + 'px');
      p.style.setProperty('--x1', (x1-10) + 'px');
      p.style.setProperty('--y1', (y1-10) + 'px');
      p.style.setProperty('--s', (16 + Math.random()*16) + 'px');
      p.style.setProperty('--d', (900 + Math.random()*600) + 'ms');
      p.style.setProperty('--r', ((Math.random()*80)-40) + 'deg');
      burst.appendChild(p);
      p.addEventListener('animationend', function(e){ e.currentTarget.remove(); });
    }
  }

  btn.addEventListener('click', function(){
    hugs++;
    var next; do { next = Math.floor(Math.random()*messages.length); } while (next === idx);
    idx = next;
    msgEl.innerHTML = '';
    var span = document.createElement('span');
    span.className = 'bubble';
    var words = messages[idx].split(' ');
    var lastWord = words.pop();
    span.appendChild(document.createTextNode(words.join(' ') + ' '));
    var tail = document.createElement('span');
    tail.style.whiteSpace = 'nowrap';
    tail.appendChild(document.createTextNode(lastWord));
    tail.appendChild(heartSvg(pick(['#ffc4da','#d9caff','#f9bcd3']), 'inline-heart'));
    span.appendChild(tail);
    msgEl.appendChild(span);
    countEl.textContent = hugs === 1 ? '1 hug received' : hugs + ' hugs received';
    stage.classList.remove('hugging');
    void stage.offsetWidth;
    stage.classList.add('hugging');
    clearTimeout(hugTimer);
    hugTimer = setTimeout(function(){ stage.classList.remove('hugging'); }, 1400);
    burstHearts();
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
  });
})();
</script>
</body>
</html>
